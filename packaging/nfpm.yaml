# .deb and .rpm packaging, driven by the release workflow:
#
#   cp build/deconflict_0.1.9_linux_amd64/deconflict build/package/deconflict
#   VERSION=0.1.9 GOARCH=amd64 nfpm package -f packaging/nfpm.yaml -p deb -t dist/
#
# nfpm expands ${VAR} in the scalar fields but not in contents, so the binary
# is staged at a fixed path before each architecture. The package carries only the
# binary: the agent hooks are per-user and written by `deconflict install`, not
# by a root-owned package script.
name: deconflict
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: devel
priority: optional
maintainer: Cloud Solutions Consulting SRL <dragos.boca@cloudsolutions.consulting>
vendor: Cloud Solutions Consulting SRL
homepage: https://github.com/cloudcons/deconflict-cli
license: Apache-2.0
description: |-
  Advisory intention claims and negotiated agreements for coding agents.
  The deconflict client: announces what an agent is about to touch, warns
  about overlaps with other agents, and never locks anything.
contents:
  - src: build/package/deconflict
    dst: /usr/bin/deconflict
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/doc/deconflict/LICENSE
    packager: rpm
    type: license
  - src: LICENSE
    dst: /usr/share/doc/deconflict/copyright
    packager: deb
  - src: NOTICE
    dst: /usr/share/doc/deconflict/NOTICE
