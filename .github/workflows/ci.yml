name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # No database service and no browser: this module has no dependencies, so the
  # job that used to take four minutes should take well under one. If it starts
  # needing a service container, something has been imported that should not be.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...

      # The acceptance test for the whole repository. `go mod graph` naming
      # anything but this module means a dependency has crept back in, which is
      # the one thing this split exists to prevent.
      - name: No third-party dependencies
        run: |
          if [ -f go.sum ]; then
            echo "go.sum exists — this module is meant to have no dependencies"
            cat go.sum
            exit 1
          fi
          graph=$(go mod graph | grep -v '^github.com/cloudcons/deconflict-cli ' | grep -v '^go@' || true)
          if [ -n "$graph" ]; then
            echo "unexpected modules in the graph:"
            echo "$graph"
            exit 1
          fi

  # Users install this on machines we do not choose, so the build matrix is the
  # platforms rather than a single linux/amd64 that proves less than it looks.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./cmd/deconflict

  # The install scripts run against the latest published release, on the
  # platforms they claim to support, so a change to either is tested the way a
  # user would meet it.
  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh packaging/homebrew.sh
      - if: runner.os != 'Windows'
        run: |
          sh install.sh --dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/deconflict" version
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          DECONFLICT_INSTALL_DIR: ${{ runner.temp }}\bin
        run: |
          ./install.ps1
          & "$env:DECONFLICT_INSTALL_DIR\deconflict.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }
